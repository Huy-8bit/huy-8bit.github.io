<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Geist';src:url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
  @font-face{font-family:'JBM';src:url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 800}
  html,body{margin:0;width:1200px;height:630px}
  body{position:relative;overflow:hidden;background:#09090b;color:#fafafa;font-family:'Geist',sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgb(250 250 250/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(250 250 250/.05) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px;
    -webkit-mask-image:radial-gradient(ellipse 70% 80% at 85% 20%,#000 20%,transparent 70%)}
  .wrap{position:absolute;inset:64px 72px}
  .top{display:flex;align-items:center;gap:14px;font-family:'JBM';font-size:18px;letter-spacing:.08em;color:#a1a1aa}
  .top i{width:10px;height:10px;border-radius:2px;background:#818cf8;display:inline-block}
  .mark{position:absolute;right:0;top:-6px}
  h1{margin:56px 0 0;font-size:104px;font-weight:600;letter-spacing:-.045em;line-height:.98}
  .focus{margin-top:26px;font-family:'JBM';font-size:22px;color:#a1a1aa}
  .focus b{color:#3f3f46;font-weight:400;margin:0 12px}
  .stmt{margin-top:34px;font-size:32px;line-height:1.3;letter-spacing:-.018em;max-width:820px}
  .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding-top:22px;border-top:1px solid #27272a}
  .work{font-family:'JBM';font-size:20px;color:#fafafa}.work span{color:#71717a;margin:0 10px}
  .url{font-family:'JBM';font-size:20px;color:#a5b4fc}
  .ticks{position:absolute;inset:-18px;pointer-events:none;background:
    linear-gradient(#52525b,#52525b) 0 0/14px 1px no-repeat,linear-gradient(#52525b,#52525b) 0 0/1px 14px no-repeat,
    linear-gradient(#52525b,#52525b) 100% 0/14px 1px no-repeat,linear-gradient(#52525b,#52525b) 100% 0/1px 14px no-repeat,
    linear-gradient(#52525b,#52525b) 0 100%/14px 1px no-repeat,linear-gradient(#52525b,#52525b) 0 100%/1px 14px no-repeat,
    linear-gradient(#52525b,#52525b) 100% 100%/14px 1px no-repeat,linear-gradient(#52525b,#52525b) 100% 100%/1px 14px no-repeat}
</style></head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="ticks"></div>
    <div class="top"><i></i>SOFTWARE ENGINEER</div>
    <svg class="mark" width="56" height="56" viewBox="0 0 40 40"><g fill="#fafafa"><rect x="7" y="4" width="6" height="18"/><rect x="3" y="20" width="6" height="16"/><rect x="13" y="16" width="14" height="6"/><rect x="27" y="4" width="6" height="32"/></g><rect x="19" y="26" width="4" height="10" fill="#818cf8"/></svg>
    <h1>Nguyen Gia Huy</h1>
    <div class="focus">Backend<b>/</b>Distributed systems<b>/</b>Databases<b>/</b>Infrastructure</div>
    <div class="stmt">I build backend systems, and tools that make complex systems easier to understand and troubleshoot.</div>
    <div class="foot">
      <div class="work">LockLens<span>·</span>KeyShift<span>·</span>ExtendPad</div>
      <div class="url">huy-8bit.github.io</div>
    </div>
  </div>
</body></html>
