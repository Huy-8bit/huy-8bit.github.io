<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&family=JetBrains+Mono&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px}
  body{background:#f4f1ea;color:#15161a;font-family:Inter,sans-serif;position:relative;overflow:hidden}
  body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgb(0 0 0 / .05) 1px,transparent 1px);background-size:3px 3px}
  .wrap{position:absolute;inset:72px 80px;display:flex;flex-direction:column}
  .k{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#6a6d75;display:flex;gap:14px;align-items:center}
  .k b{width:12px;height:12px;border-radius:50%;background:#23a26d;display:inline-block}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:150px;line-height:.9;letter-spacing:-.025em;margin:36px 0 0}
  h1 em{color:#d2491f}
  p{font-size:28px;line-height:1.45;color:#3b3e46;max-width:900px;margin:30px 0 0}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ddd7ca;padding-top:24px;font-family:'JetBrains Mono',monospace;font-size:20px;color:#6a6d75}
  .foot span:last-child{color:#15161a}
</style></head>
<body><div class="wrap">
  <div class="k"><b></b>Software Engineer · Core Banking</div>
  <h1>Nguyen Gia <em>Huy</em></h1>
  <p>Core banking, cloud platforms, data pipelines and observability — Go, Python, AWS, Kubernetes.</p>
  <div class="foot"><span>Vault Core · T24 · OpenStack · PostgreSQL</span><span>huy-8bit.github.io</span></div>
</div></body></html>
