<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Geist';src:url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
  @font-face{font-family:'JBM';src:url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 800}
  html,body{margin:0;width:1200px;height:630px}
  body{position:relative;overflow:hidden;background:#060816;color:#f8fafc;font-family:'Geist',sans-serif}
  .g{position:absolute;border-radius:50%}
  .g1{left:-260px;top:-360px;width:900px;height:900px;background:radial-gradient(closest-side,rgb(99 102 241/.42),transparent)}
  .g2{right:-280px;top:-200px;width:860px;height:860px;background:radial-gradient(closest-side,rgb(34 211 238/.22),transparent)}
  .g3{left:420px;bottom:-560px;width:900px;height:900px;background:radial-gradient(closest-side,rgb(139 92 246/.34),transparent)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgb(148 163 184/.08) 1px,transparent 1px),linear-gradient(90deg,rgb(148 163 184/.08) 1px,transparent 1px);background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse 70% 80% at 75% 30%,#000 25%,transparent 72%)}
  .wrap{position:absolute;inset:60px 72px}
  .top{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 14px;border:1px solid rgb(148 163 184/.2);border-radius:999px;background:rgb(13 18 36/.6);font-size:20px;font-weight:500}
  .top i{width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}
  .top span{color:#a9b4c9;font-weight:400}
  .mark{position:absolute;right:0;top:2px}
  h1{margin:34px 0 0;font-size:118px;font-weight:650;letter-spacing:-.055em;line-height:.92}
  h1 .b{display:block;background:linear-gradient(100deg,#818cf8,#c084fc 45%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
  .chips{display:flex;gap:10px;margin-top:26px}
  .chips span{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;font-family:'JBM';font-size:18px;border:1px solid}
  .chips i{width:8px;height:8px;border-radius:2px}
  .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding-top:22px;border-top:1px solid rgb(148 163 184/.18)}
  .work{display:flex;gap:26px;font-size:26px;font-weight:650;letter-spacing:-.03em}
  .ll{background:linear-gradient(100deg,#4f8fd6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ks{background:linear-gradient(100deg,#ef4444,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ep{background:linear-gradient(100deg,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .url{font-family:'JBM';font-size:20px;color:#a5b4fc}
</style></head>
<body>
  <div class="g g1"></div><div class="g g2"></div><div class="g g3"></div><div class="grid"></div>
  <div class="wrap">
    <div class="top"><i></i>Software Engineer <span>· backend, distributed systems, databases</span></div>
    <svg class="mark" width="56" height="56" viewBox="0 0 40 40"><g fill="#f8fafc"><rect x="7" y="4" width="6" height="18"/><rect x="3" y="20" width="6" height="16"/><rect x="13" y="16" width="14" height="6"/><rect x="27" y="4" width="6" height="32"/></g><rect x="19" y="26" width="4" height="10" fill="#22d3ee"/></svg>
    <h1>Nguyen<span class="b">Gia Huy</span></h1>
    <div class="chips">
      <span style="border-color:rgb(99 102 241/.45);background:rgb(99 102 241/.12)"><i style="background:#818cf8"></i>Backend</span>
      <span style="border-color:rgb(139 92 246/.45);background:rgb(139 92 246/.12)"><i style="background:#a78bfa"></i>Distributed systems</span>
      <span style="border-color:rgb(34 211 238/.4);background:rgb(34 211 238/.1)"><i style="background:#22d3ee"></i>Databases</span>
      <span style="border-color:rgb(52 211 153/.4);background:rgb(52 211 153/.1)"><i style="background:#34d399"></i>Open source</span>
    </div>
    <div class="foot">
      <div class="work"><span class="ll">LockLens</span><span class="ks">KeyShift</span><span class="ep">ExtendPad</span></div>
      <div class="url">huy-8bit.github.io</div>
    </div>
  </div>
</body></html>
